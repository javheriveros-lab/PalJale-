name: Keep-alive ping

# Pinguea periódicamente el backend y la web para evitar que el servicio
# se marque como inactivo. Los defaults apuntan a los dominios de Railway
# (api.paljale.mx / paljale.mx todavía no resuelven en DNS); una vez que
# los dominios personalizados estén activos, configura las variables del
# repo BACKEND_HEALTH_URL / WEB_URL en Settings → Secrets and variables →
# Actions → Variables para sobreescribirlos sin tocar este archivo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /api/health
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL || 'https://paljale-production.up.railway.app/api/health' }}
        run: |
          echo "Pinging $URL"
          code=$(curl -s -o /tmp/backend_health.json -w "%{http_code}" "$URL" || echo "000")
          cat /tmp/backend_health.json 2>/dev/null || true
          echo "status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Backend health check devolvió $code (no se falla el workflow, solo aviso)"
          fi

      - name: Ping web
        env:
          URL: ${{ vars.WEB_URL || 'https://caring-miracle-production-4a1b.up.railway.app' }}
        run: |
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Web health check devolvió $code (no se falla el workflow, solo aviso)"
          fi
